name: Daglig papperstrading
on:
  schedule:
    - cron: "40 21 * * 1-5"   # 22:40 svensk vintertid, efter att både Stockholm och USA stängt
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  kor:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backtest varje måndag (eller första gången)
        run: '[ "$(date +%u)" = "1" ] || [ ! -f backtest.json ] && python tradingbot.py backtest || true'
      - name: Handla och bygg rapport
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tradingbot.py allt
      - name: Spara resultat
        run: |
          git config user.name "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add -A
          git commit -m "Papperstrading $(date +%F)" || echo "inget nytt"
          git push
      - name: Larma om något gick fel
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Tradingboten kraschade ${new Date().toISOString().slice(0, 10)}`,
              body: `Den dagliga körningen misslyckades, så portföljerna och appen uppdaterades inte idag.\n\nSe felet här: ${url}\n\nSkicka länken till Claude så fixar vi det.`
            });
